[versions]
agp = "9.3.2"
core = "1.16.0"
appcompat = "1.7.1"
fragment = "1.8.8"
lifecycle = "2.9.1"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
brvah = "4.1.4"
junit = "4.13.2"
junitVersion = "1.1.5"
espresso = "3.5.1"
appcompatVersion = "1.8.0"

[libraries]
material = { module = "com.google.android.material:material", version = "1.12.0" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version = "1.2.0" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version = "2.11.0" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version = "2.11.0" }
retrofit-rxjava3 = { module = "com.squareup.retrofit2:adapter-rxjava3", version = "2.11.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version = "4.12.0" }
rxjava = { module = "io.reactivex.rxjava3:rxjava", version = "3.1.10" }
rxandroid = { module = "io.reactivex.rxjava3:rxandroid", version = "3.0.2" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
brvah = { module = "io.github.cymchad:BaseRecyclerViewAdapterHelper4", version.ref = "brvah" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompatVersion" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
